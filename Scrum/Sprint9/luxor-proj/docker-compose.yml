# Entorno de desarrollo local. Funciona sin .env: cada variable tiene un valor
# por defecto pensado solo para local (${VAR:-valor}). Si existe un .env en esta
# carpeta, sus valores tienen prioridad. En producción las variables se cargan en
# Render y Vercel, nunca desde aquí.
services:
  frontend:
    build: .
    container_name: luxor-frontend
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      # vite no recibe los eventos de cambio del volumen montado: revisa los archivos por sondeo.
      VITE_USE_POLLING: "true"
    depends_on:
      - backend

  backend:
    build: ./backend
    container_name: luxor-backend
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      # Dentro de la red de Docker la base siempre es db:5432, aunque el .env diga otra cosa.
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-habibi_parfums}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-solo-para-docker-local}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      PERFUM_API_BASE_URL: ${PERFUM_API_BASE_URL:-https://perfumapidatabase.onrender.com}
      PAYMENT_GATEWAY_API_KEY: ${PAYMENT_GATEWAY_API_KEY:-sandbox_dev_key}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      LOW_STOCK_THRESHOLD: ${LOW_STOCK_THRESHOLD:-3}
      # Clave compartida con el chatbot para registrar consultas (POST /chatbot/queries).
      CHATBOT_INTERNAL_KEY: ${CHATBOT_INTERNAL_KEY:-dev-chatbot-key-solo-local}
    depends_on:
      db:
        condition: service_healthy
    # Espera que la DB esté lista y luego corre seed + server
    command: sh -c "node seed.js && node server.js"

  db:
    image: postgres:16
    container_name: luxor-postgres
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-habibi_parfums}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  chatbot:
    build: ./backend/chatbot
    container_name: luxor-chatbot
    ports:
      - "8000:8000"
    env_file:
      # Aquí van LLM_API_KEY y demás variables del LLM si se quiere usar Groq.
      - path: .env
        required: false
    environment:
      # Dentro de la red de Docker Compose el backend se resuelve por el nombre
      # del servicio, no por localhost (que dentro de este contenedor apuntaría
      # al propio contenedor del chatbot).
      NODE_API_URL: http://backend:3000
      # Ollama corre en el host (no como servicio de este compose). En Docker
      # Desktop se accede a él vía host.docker.internal.
      OLLAMA_URL: http://host.docker.internal:11434
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
      CHATBOT_ALLOWED_ORIGINS: ${CHATBOT_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      CHATBOT_INTERNAL_KEY: ${CHATBOT_INTERNAL_KEY:-dev-chatbot-key-solo-local}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend

volumes:
  postgres_data:
