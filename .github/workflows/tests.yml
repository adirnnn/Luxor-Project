name: Tests

on:
  push:
    branches: [main, staging]
    paths:
      - "Scrum/Sprint7/luxor-proj/**"
      - ".github/workflows/tests.yml"
  pull_request:
    branches: [main, staging]
    paths:
      - "Scrum/Sprint7/luxor-proj/**"
      - ".github/workflows/tests.yml"

defaults:
  run:
    working-directory: Scrum/Sprint7/luxor-proj

jobs:
  backend-tests:
    name: Backend (node --test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Scrum/Sprint7/luxor-proj/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: Scrum/Sprint7/luxor-proj/backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Correr pruebas
        run: npm test

  frontend-tests:
    name: Frontend (vitest + build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: Scrum/Sprint7/luxor-proj/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Correr pruebas
        run: npm run test:run

      - name: Verificar build
        run: npm run build

  chatbot-tests:
    name: Chatbot (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Scrum/Sprint7/luxor-proj/backend/chatbot
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: Scrum/Sprint7/luxor-proj/backend/chatbot/requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Correr pruebas
        run: pytest -v